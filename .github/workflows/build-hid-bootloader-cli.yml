# TRIGGER: manual only (Actions tab -> this workflow -> "Run workflow"),
# restricted to the repo owner via the job-level `if:` checks below.
#
# Builds 3rd_party/0_experimental/hid_bootloader_cli/src-libusb1/hid_bootloader_cli.c
# for the full target matrix. Use the `target` input to run ONE job while
# debugging a new arch/OS - fix it, re-dispatch with that same target until
# it's green, then dispatch with `target: all` to build the full matrix and
# produce the packaged zip (the `package` job only runs when `target: all`).
#
# See src-libusb1/README.txt "CI Build" section for target notes and caveats.

name: Build hid_bootloader_cli

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which target to build (use a single target to debug, "all" to build+package everything)'
        type: choice
        default: all
        options:
          - all
          - linux-x86
          - linux-x64
          - linux-arm32
          - linux-arm64
          - windows-x86
          - windows-x64
          - windows-arm64
          - macos
          - freebsd-x64
          - openbsd-x64

env:
  SRC_DIR: 3rd_party/0_experimental/hid_bootloader_cli/src-libusb1
  LIBUSB_VERSION: 1.0.26

jobs:

  # --------------------------------------------------------------------------------------------
  # Setup - filters the linux/windows matrices down to just the selected `target` (or everything,
  # for `target: all`) BEFORE any runner spins up, so picking one target doesn't burn minutes
  # spinning up containers/VMs for the other arches in that OS's matrix just to no-op them.
  # --------------------------------------------------------------------------------------------
  setup:
    if: github.actor == 'blue-wind-25'
    runs-on: ubuntu-latest
    outputs:
      linux_matrix: ${{ steps.filter.outputs.linux_matrix }}
      windows_matrix: ${{ steps.filter.outputs.windows_matrix }}
    steps:
      - id: filter
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -eux
          LINUX_ALL='[
            {"name":"linux-x86","image":"messense/rust-musl-cross:i686-musl","cross_triple":"i686-unknown-linux-musl"},
            {"name":"linux-x64","image":"messense/rust-musl-cross:x86_64-musl","cross_triple":"x86_64-unknown-linux-musl"},
            {"name":"linux-arm32","image":"messense/rust-musl-cross:armv7-musleabihf","cross_triple":"armv7-unknown-linux-musleabihf"},
            {"name":"linux-arm64","image":"messense/rust-musl-cross:aarch64-musl","cross_triple":"aarch64-unknown-linux-musl"}
          ]'
          WINDOWS_ALL='[
            {"name":"windows-x86","msvc_arch":"x86"},
            {"name":"windows-x64","msvc_arch":"x64"},
            {"name":"windows-arm64","msvc_arch":"x64_arm64"}
          ]'
          if [ "$TARGET" = "all" ]; then
            LINUX_SEL="$LINUX_ALL"
            WINDOWS_SEL="$WINDOWS_ALL"
          else
            LINUX_SEL="$(echo "$LINUX_ALL" | jq -c --arg t "$TARGET" '[.[] | select(.name == $t)]')"
            WINDOWS_SEL="$(echo "$WINDOWS_ALL" | jq -c --arg t "$TARGET" '[.[] | select(.name == $t)]')"
          fi
          echo "linux_matrix=$(echo "$LINUX_SEL" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "windows_matrix=$(echo "$WINDOWS_SEL" | jq -c .)" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------------------------
  # Linux - static musl builds (portable across glibc versions since there's no glibc at all)
  # --------------------------------------------------------------------------------------------
  linux:
    needs: setup
    if: github.actor == 'blue-wind-25' && needs.setup.outputs.linux_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.linux_matrix) }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static libusb-1.0 for ${{ matrix.cross_triple }}
        env:
          CC: ${{ matrix.cross_triple }}-gcc
        run: |
          set -eux
          curl -fsSL "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2" -o libusb.tar.bz2
          tar xf libusb.tar.bz2
          cd "libusb-${LIBUSB_VERSION}"
          CC=$CC ./configure --host="${{ matrix.cross_triple }}" --disable-shared --enable-static --disable-udev \
            || { echo '----- config.log -----'; cat config.log; exit 1; }
          make -j"$(nproc)"

      - name: Compile hid_bootloader_cli.c
        working-directory: ${{ env.SRC_DIR }}
        env:
          CC: ${{ matrix.cross_triple }}-gcc
        run: |
          set -eux
          # hid_bootloader_cli.c does `#include <libusb-1.0/libusb.h>`, but libusb's own
          # source tree has the header directly in libusb/ (no libusb-1.0/ subdir) - only
          # `make install` creates that layout. Fake it with a symlink instead of installing.
          ln -sf "$GITHUB_WORKSPACE/libusb-${LIBUSB_VERSION}/libusb" "$GITHUB_WORKSPACE/libusb-1.0"
          $CC -O2 -Wall -Wno-misleading-indentation -static -s \
            -o hid_bootloader_cli \
            hid_bootloader_cli.c \
            -DUSE_LIBUSB \
            -I "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/libusb-${LIBUSB_VERSION}/libusb/.libs/libusb-1.0.a"
          file hid_bootloader_cli

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.SRC_DIR }}/hid_bootloader_cli
          retention-days: 1 # Automatically cleanup quickly
          if-no-files-found: error

  # --------------------------------------------------------------------------------------------
  # Windows - native MSVC cross toolsets (windows-latest ships full VS Build Tools, incl. ARM)
  # --------------------------------------------------------------------------------------------
  windows:
    needs: setup
    if: github.actor == 'blue-wind-25' && needs.setup.outputs.windows_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.windows_matrix) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Write unistd.h compat shim (MSVC has no unistd.h; the source only needs usleep())
        shell: pwsh
        run: |
          Set-Content -Path "${{ env.SRC_DIR }}\unistd.h" -Value @'
          #pragma once
          #include <windows.h>
          static __inline void usleep(long usec) { Sleep((DWORD)((usec + 999) / 1000)); }
          '@

      - name: Compile hid_bootloader_cli.c
        working-directory: ${{ env.SRC_DIR }}
        shell: cmd
        run: |
          cl /O2 /W3 /DUSE_WIN32 /I . /Fe:hid_bootloader_cli.exe hid_bootloader_cli.c setupapi.lib hid.lib

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.SRC_DIR }}/hid_bootloader_cli.exe
          retention-days: 1 # Automatically cleanup quickly
          if-no-files-found: error

  # --------------------------------------------------------------------------------------------
  # MacOS - universal binary (x86_64 + arm64) built natively with Xcode's clang
  # --------------------------------------------------------------------------------------------
  macos:
    if: github.actor == 'blue-wind-25' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile universal hid_bootloader_cli
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -eux
          clang -O2 -Wall -mmacosx-version-min=10.13 \
            -arch x86_64 -arch arm64 \
            -DUSE_APPLE_IOKIT \
            -framework IOKit -framework CoreFoundation \
            -o hid_bootloader_cli hid_bootloader_cli.c
          lipo -info hid_bootloader_cli

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: ${{ env.SRC_DIR }}/hid_bootloader_cli
          retention-days: 1 # Automatically cleanup quickly
          if-no-files-found: error

  # --------------------------------------------------------------------------------------------
  # FreeBSD / OpenBSD - built inside a QEMU VM via vmactions (no native GH-hosted runner exists)
  # --------------------------------------------------------------------------------------------
  freebsd:
    if: github.actor == 'blue-wind-25' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'freebsd-x64')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          envs: 'SRC_DIR'
          # libusb has shipped in the FreeBSD base system since 10.0 - no port/package for it.
          prepare: pkg install -y gcc
          run: |
            set -eux
            cd "${SRC_DIR}"
            # FreeBSD base's libusb headers live flat at /usr/include/libusb.h, not under a
            # libusb-1.0/ subdir like the source's `#include <libusb-1.0/libusb.h>` expects.
            hdr="$(find /usr/include /usr/local/include -maxdepth 1 -name libusb.h | head -n1)"
            mkdir -p /tmp/incshim/libusb-1.0
            ln -sf "$hdr" /tmp/incshim/libusb-1.0/libusb.h
            cc -O2 -Wall -I /tmp/incshim -o hid_bootloader_cli hid_bootloader_cli.c -DUSE_LIBUSB -lusb
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-x64
          path: ${{ env.SRC_DIR }}/hid_bootloader_cli
          retention-days: 1 # Automatically cleanup quickly
          if-no-files-found: error

  openbsd:
    if: github.actor == 'blue-wind-25' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'openbsd-x64')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          envs: 'SRC_DIR'
          # Trailing '--' pins the default (non-debug) flavor; plain 'libusb1' is ambiguous
          # between libusb1-<ver> and libusb1-<ver>-debug.
          prepare: pkg_add libusb1--
          run: |
            set -eux
            cd "${SRC_DIR}"
            # OpenBSD's libusb1 package installs headers under /usr/local/include/libusb-1.0/ -
            # find it rather than hardcode, in case the package layout ever changes.
            hdr="$(find /usr/local/include -maxdepth 2 -name libusb.h | head -n1)"
            mkdir -p /tmp/incshim/libusb-1.0
            ln -sf "$hdr" /tmp/incshim/libusb-1.0/libusb.h
            cc -O2 -Wall -I /tmp/incshim -L /usr/local/lib -o hid_bootloader_cli hid_bootloader_cli.c -DUSE_LIBUSB -lusb-1.0
      - uses: actions/upload-artifact@v4
        with:
          name: openbsd-x64
          path: ${{ env.SRC_DIR }}/hid_bootloader_cli
          retention-days: 1 # Automatically cleanup quickly
          if-no-files-found: error

  # --------------------------------------------------------------------------------------------
  # Package - only runs on a full ("all") dispatch, once every job above is green.
  # Collects every per-target artifact into build/<target>/ (mirroring the local Makefile's
  # build/ layout) and zips the whole tree into one download.
  # --------------------------------------------------------------------------------------------
  package:
    if: github.actor == 'blue-wind-25' && github.event.inputs.target == 'all'
    needs: [linux, windows, macos, freebsd, openbsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Assemble build/<target>/ tree and zip it
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -eux
          rm -rf build/ci
          for d in "$GITHUB_WORKSPACE"/downloaded/*/; do
            name="$(basename "$d")"
            mkdir -p "build/ci/$name"
            cp -a "$d"/* "build/ci/$name/"
          done
          VERSION="$(sed -n "s/^PROGRAM_VERSION *:= *//p" Makefile)"
          ( cd build/ci && zip -r "../hid_bootloader_cli-${VERSION}-all-targets.zip" . )
          ls -la build/

      - uses: actions/upload-artifact@v4
        with:
          name: hid_bootloader_cli-all-targets
          path: ${{ env.SRC_DIR }}/build/*-all-targets.zip
          retention-days: 1 # Automatically cleanup quickly
          if-no-files-found: error

      - name: Delete per-target artifacts now that they're packaged into the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          for name in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[] | select(.name != "hid_bootloader_cli-all-targets") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$name"
          done
