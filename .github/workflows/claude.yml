name: Claude
on:
  issues:
    types: [assigned]
jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "${{ github.event.issue.title }}. ${{ github.event.issue.body }}. After making changes, create a new git branch, commit the changes, push the branch, and open a pull request."
          claude_args: "--allowedTools Edit,Write,Bash,Read"
          # show_full_output: true  # uncomment for debugging
