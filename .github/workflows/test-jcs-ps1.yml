# TRIGGER: manual only (Actions tab -> this workflow -> "Run workflow"), and
# restricted to the repo owner via the job-level `if:` check below - anyone
# else who dispatches it will see the job start and immediately no-op (GitHub
# has no way to hide workflow_dispatch itself from other collaborators, but
# this keeps them from actually burning Windows-runner minutes with it).
#
# NOTE: start/compile/run/stop for a given daemon are kept within a single
# step wherever the daemon's liveness matters across them. The GitHub Actions
# Windows runner wraps each step's process tree in a Windows Job Object with
# kill-on-close, so a background daemon spawned in one step is killed the
# instant that step's process exits - it would never survive into a later
# step. That's a CI-runner artifact, not something a real interactive user
# hits, but it means these scripts can only be exercised end-to-end within
# one step here.
name : Test JCS PowerShell scripts

on   :
  workflow_dispatch :

jobs :
  test         :
    if              : github.actor == 'blue-wind-25'
    runs-on         : windows-latest
    timeout-minutes : 10
    defaults        :
      run :
        shell             : pwsh
        working-directory : util/JCS

    steps           :
      - uses : actions/checkout@v4
      - name : Set up JDK 21
        uses : actions/setup-java@v4
        with :
          distribution : temurin
          java-version : '21'

      - name              : Build compile-server.jar
        shell             : bash
        working-directory : util/JCS
        run               : ./build-server.sh
      - name : Start server, compile, run, stop (start-compile-server.ps1 / javac-client.ps1 / stop-compile-server.ps1)
        run  : |
          $ErrorActionPreference = 'Stop'
          try {
              .\start-compile-server.ps1 21000
              if ($LASTEXITCODE -ne 0) { throw "start-compile-server.ps1 failed" }

              New-Item -ItemType Directory -Force -Path out | Out-Null
              Set-Content -Path Hello.java -Value @'
          public class Hello {
              public static void main(String[] args) {
                  System.out.println("Hello from JCS");
              }
          }
          '@
              .\javac-client.ps1 21000 -d out Hello.java
              if ($LASTEXITCODE -ne 0) { throw "javac-client.ps1 failed to compile" }
              if (-not (Test-Path 'out\Hello.class')) { throw "Hello.class was not produced" }

              $output = & java -cp out Hello
              Write-Host $output
              if ($output -ne 'Hello from JCS') { throw "Unexpected program output: $output" }
          } finally {
              .\stop-compile-server.ps1 21000
          }

      - name : Reject a JRE-only java path (should fail closed)
        run  : |
          $fakeJre = Join-Path $env:RUNNER_TEMP 'fake-jre\bin'
          New-Item -ItemType Directory -Force -Path $fakeJre | Out-Null
          Copy-Item (Get-Command java).Source (Join-Path $fakeJre 'java.exe')
          .\start-compile-server.ps1 21001 (Join-Path $fakeJre 'java.exe')
          if ($LASTEXITCODE -eq 0) { throw "start-compile-server.ps1 should have refused a JRE-only java path" }
          # Reset $LASTEXITCODE: pwsh steps fail if it's non-zero at step end,
          # but a non-zero exit here is exactly the expected/verified outcome.
          $LASTEXITCODE = 0

      - name : Upload daemon logs on failure
        if   : failure()
        uses : actions/upload-artifact@v4
        with :
          name              : jcs-daemon-logs
          path              : ${{ runner.temp }}\javac-daemon-*.log
          if-no-files-found : ignore

  test-wrapper :
    needs           : test
    if              : github.actor == 'blue-wind-25'
    runs-on         : windows-latest
    timeout-minutes : 10
    defaults        :
      run :
        shell : pwsh

    steps           :
      - uses : actions/checkout@v4
      - name : Set up JDK 21
        uses : actions/setup-java@v4
        with :
          distribution : temurin
          java-version : '21'

      - name              : Build compile-server.jar
        shell             : bash
        working-directory : util/JCS
        run               : ./build-server.sh
      - name : Install the transparent javac wrapper into JAVA_HOME
        run  : |
          $jdkBin = Join-Path $env:JAVA_HOME 'bin'
          Rename-Item (Join-Path $jdkBin 'javac.exe') 'javac.real.exe'
          Copy-Item util\JCS\javac-daemon-wrapper.ps1 (Join-Path $jdkBin 'javac-daemon-wrapper.ps1')
          Copy-Item util\JCS\javac-daemon-wrapper.cmd (Join-Path $jdkBin 'javac.cmd')
          Copy-Item util\JCS\_port.ps1 (Join-Path $jdkBin '_port.ps1')
          Copy-Item util\JCS\_javac_args.ps1 (Join-Path $jdkBin '_javac_args.ps1')
          Copy-Item util\JCS\_native.ps1 (Join-Path $jdkBin '_native.ps1')
          Copy-Item util\JCS\compile-server.jar (Join-Path $jdkBin 'compile-server.jar')

      - name : Compile via wrapper, confirm daemon reuse, stop
        run  : |
          $ErrorActionPreference = 'Stop'
          $port    = 21000
          $pidFile = Join-Path $env:TEMP "javac-daemon-$port.pid"
          $logFile = Join-Path $env:TEMP "javac-daemon-$port.log"

          function Dump-Diagnostics {
              Write-Host '---- daemon log ----'
              if (Test-Path $logFile) { Get-Content $logFile | Write-Host } else { Write-Host '(no log file)' }
              Write-Host '---- live processes (java/javac/cmd/powershell) ----'
              Get-Process -ErrorAction SilentlyContinue |
                  Where-Object { $_.ProcessName -match '^(java|javac|cmd|powershell|pwsh)' } |
                  Format-Table Id, ProcessName, StartTime | Out-String | Write-Host
          }

          # Run a wrapper compile with a bounded timeout via a background job,
          # so a hang shows live diagnostics instead of silently eating the
          # whole 10-minute job timeout with zero output (output piped into a
          # variable, as a plain `cmd /c ... 2>&1` capture would do, only
          # flushes once the command returns -- useless if it never does).
          function Invoke-WrapperCompile {
              $job = Start-Job -ScriptBlock {
                  Set-Location $using:PWD
                  cmd /c javac -d out Hello.java 2>&1
                  "___EXITCODE___$LASTEXITCODE"
              }
              if (-not (Wait-Job $job -Timeout 60)) {
                  Write-Host '---- TIMEOUT: wrapper compile did not finish within 60s ----'
                  Receive-Job $job | Write-Host
                  Dump-Diagnostics
                  Stop-Job $job -ErrorAction SilentlyContinue
                  Remove-Job $job -Force -ErrorAction SilentlyContinue
                  throw 'wrapper compile timed out'
              }
              $jobErrors = $null
              $raw = Receive-Job $job -ErrorVariable jobErrors -ErrorAction SilentlyContinue
              Write-Host "---- job state: $($job.JobStateInfo.State), raw output line count: $(@($raw).Count) ----"
              if ($jobErrors) {
                  Write-Host '---- job errors ----'
                  $jobErrors | ForEach-Object { Write-Host $_.ToString() }
              }
              Remove-Job $job -Force -ErrorAction SilentlyContinue
              $exitLine = $raw | Where-Object { $_ -match '^___EXITCODE___(-?\d+)$' } | Select-Object -Last 1
              $script:LASTEXITCODE = if ($exitLine -match '^___EXITCODE___(-?\d+)$') { [int]$Matches[1] } else { 1 }
              $raw | Where-Object { $_ -notmatch '^___EXITCODE___' } | Write-Host
          }

          try {
              New-Item -ItemType Directory -Force -Path out | Out-Null
              Set-Content -Path Hello.java -Value @'
          public class Hello {
              public static void main(String[] args) {
                  System.out.println("Hello from wrapper");
              }
          }
          '@
              # cmd.exe resolves .cmd before .exe, so this hits javac-daemon-wrapper.cmd.
              Invoke-WrapperCompile
              if ($LASTEXITCODE -ne 0) { Dump-Diagnostics; throw "wrapper failed to compile" }
              if (-not (Test-Path 'out\Hello.class')) { Dump-Diagnostics; throw "Hello.class was not produced by the wrapper" }

              $output = & java -cp out Hello
              Write-Host $output
              if ($output -ne 'Hello from wrapper') { throw "Unexpected program output: $output" }

              if (-not (Test-Path $pidFile)) { throw "Expected daemon PID file $pidFile was not created; wrapper may have silently fallen back to javac.real.exe" }
              $firstPid = Get-Content $pidFile

              Invoke-WrapperCompile
              if ($LASTEXITCODE -ne 0) { Dump-Diagnostics; throw "second wrapper compile failed" }

              $secondPid = Get-Content $pidFile
              if ($secondPid -ne $firstPid) { throw "daemon PID changed between compiles ($firstPid -> $secondPid); expected reuse of the same daemon" }
          } finally {
              if (Test-Path $pidFile) {
                  Stop-Process -Id (Get-Content $pidFile) -Force -ErrorAction SilentlyContinue
              }
          }

      - name : Upload daemon logs on failure
        if   : failure()
        uses : actions/upload-artifact@v4
        with :
          name              : jcs-wrapper-daemon-logs
          path              : ${{ runner.temp }}\javac-daemon-*.log
          if-no-files-found : ignore
