# ============================================================
# JxMake macOS test (manual)
# ============================================================
#
# TRIGGER: manual only (Actions tab -> this workflow -> "Run workflow"),
# restricted to the repo owner via the job-level `if:` checks below.
#
# Two independent phases, selectable via the `test_phase` input:
#
#   zip_smoke_test    (priority, cheap) - builds the distribution zip once on
#           a Linux runner (`make dist` under src/, same as this repo's
#           normal dev flow), uploads it as an artifact, then on a macOS
#           runner downloads + unzips it and runs:
#             ./jxmake                                          (expect usage error text)
#             ./jxmake -e '$printf("%s is %d\n", "A", 10)'      (expect "A is 10")
#           against BOTH Java 8 and Java 25 (via JXMAKE_JAVA=<jdk>/bin/java,
#           see jxmake.sh) and asserts both give byte-identical output.
#           This only proves the *already-built* jar/launcher works on macOS -
#           it says nothing about whether `make dist` itself would succeed
#           there (that's native_macos_build).
#
#   native_macos_build - runs `make dist` directly on the macOS runner, with
#             JDK_PATH_8/JDK_PATH_25 pointed at that runner's installed JDKs
#             (src/Makefile reads these as overridable `?=` vars - see
#             src/Makefile around line 113). Only checks that the build
#             succeeds and produces the zip; does not re-run the
#             zip_smoke_test checks against that macOS-built zip (add as a
#             follow-up if that combination needs its own coverage).
#
#   both              - runs zip_smoke_test then native_macos_build.
#
# Feasibility notes:
#   - `make dist` (src/Makefile) uses `cp ... *.{sh,cmd}` brace expansion,
#     which needs bash; macOS's /bin/sh is bash-compatible for this. `zip`
#     ships with macOS. No GNU-only flags were found in the `jar`/`dist`
#     target chain, so native_macos_build should need "minimal changes" as
#     expected - but this has not been verified end-to-end on a real macOS
#     runner yet, which is the whole point of adding this workflow.
#   - jxmake.sh (renamed to `jxmake` in the dist zip) already supports
#     picking an arbitrary `java` via the JXMAKE_JAVA env var, so testing
#     both JDKs against one extracted zip needs no re-extraction.
#
# Runner: macos-14 (Apple Silicon) is used - macos-13 (Intel)-hosted runners
# have been getting stuck with no runner ever picked up (GitHub has been
# retiring/throttling that image), so avoid it here.
#
# JDK 8 on macOS-aarch64: Temurin does not publish a macOS-aarch64 JDK 8
# build, so the macOS jobs use Zulu for Java 8 instead (Zulu does ship one).
# Java 25 stays on Temurin everywhere. The Linux job keeps Temurin 8, which
# is fine there.
#
# `make dist`'s recipes need bash (`[ x == y ]` tests, `{a,b,c}` brace
# expansion in `mkdir -p .../apps/{...}`) but `make` runs recipes via
# /bin/sh regardless of the workflow step's shell, and /bin/sh is dash on
# Ubuntu (not bash) - so every `make dist` invocation below passes
# `SHELL=/bin/bash` explicitly to override make's recipe shell.
# ============================================================
name : Test JxMake (macOS)

on   :
  workflow_dispatch :
    inputs :
      test_phase :
        description : 'Which phase(s) to run'
        type        : choice
        options     : [zip_smoke_test, native_macos_build, both]
        default     : zip_smoke_test

env  :
  DIST_VER : 0.9.9-tp3

jobs :
  # --------------------------------------------------------------------------------------------
  # zip_smoke_test (1/2) - build the dist zip once, on Linux (cheap runner minutes), for the
  # macOS smoke-test job below to consume.
  # --------------------------------------------------------------------------------------------
  build-dist-linux :
    if      : github.actor == 'blue-wind-25' && (inputs.test_phase == 'zip_smoke_test' || inputs.test_phase == 'both')
    runs-on : ubuntu-latest
    steps   :
      - uses : actions/checkout@v4

      - name : Set up JDK 8
        uses : actions/setup-java@v4
        with :
          distribution : temurin
          java-version : '8'

      - name : Set up JDK 25
        uses : actions/setup-java@v4
        with :
          distribution : temurin
          java-version : '25'

      - name              : Build distribution zip
        working-directory : src
        run               : make dist SHELL=/bin/bash JDK_PATH_8="$JAVA_HOME_8_X64" JDK_PATH_25="$JAVA_HOME_25_X64"

      - uses : actions/upload-artifact@v4
        with :
          name              : jxmake-dist-zip
          path              : dist_build/JxMake-${{ env.DIST_VER }}.zip
          retention-days    : 1
          if-no-files-found : error

  # --------------------------------------------------------------------------------------------
  # zip_smoke_test (2/2) - the priority test: extract the zip on macOS and run the two smoke
  # commands under both Java 8 and Java 25, asserting identical output.
  # --------------------------------------------------------------------------------------------
  test-zip-macos :
    needs   : build-dist-linux
    if      : github.actor == 'blue-wind-25' && (inputs.test_phase == 'zip_smoke_test' || inputs.test_phase == 'both')
    runs-on : macos-14
    steps   :
      - name : Set up JDK 8 (Zulu - Temurin has no macOS-aarch64 JDK 8 build)
        uses : actions/setup-java@v4
        with :
          distribution : zulu
          java-version : '8'

      - name : Set up JDK 25
        uses : actions/setup-java@v4
        with :
          distribution : temurin
          java-version : '25'

      - uses : actions/download-artifact@v4
        with :
          name : jxmake-dist-zip

      - name : Extract distribution zip
        run  : unzip -q JxMake-${{ env.DIST_VER }}.zip

      - name : Run smoke tests under Java 8 and Java 25
        run  : |
          set -euo pipefail
          chmod +x jxmake

          run_for_jdk() {
            local jdk_home="$1"
            local label="$2"
            export JXMAKE_JAVA="$jdk_home/bin/java"

            echo "=== [$label] ./jxmake (no args) ==="
            usage_out="$(./jxmake 2>&1 || true)"
            echo "$usage_out"
            if [[ "$usage_out" != *"no command line arguments specified and no 'JxMakeFile' in the current directory"* ]]; then
              echo "FAIL [$label]: usage-error text not found" >&2
              exit 1
            fi

            echo "=== [$label] ./jxmake -e '\$printf(...)' ==="
            eval_out="$(./jxmake -e '$printf("%s is %d\n", "A", 10)')"
            echo "$eval_out"
            if [[ "$eval_out" != "A is 10" ]]; then
              echo "FAIL [$label]: expected 'A is 10', got '$eval_out'" >&2
              exit 1
            fi
          }

          run_for_jdk "$JAVA_HOME_8_ARM64"  "Java 8"
          run_for_jdk "$JAVA_HOME_25_ARM64" "Java 25"

          echo "PASS: Java 8 and Java 25 produced matching results."

  # --------------------------------------------------------------------------------------------
  # native_macos_build - build the distribution directly on macOS (the actual feasibility
  # question).
  # --------------------------------------------------------------------------------------------
  build-dist-macos :
    if      : github.actor == 'blue-wind-25' && (inputs.test_phase == 'native_macos_build' || inputs.test_phase == 'both')
    runs-on : macos-14
    steps   :
      - uses : actions/checkout@v4

      - name : Set up JDK 8 (Zulu - Temurin has no macOS-aarch64 JDK 8 build)
        uses : actions/setup-java@v4
        with :
          distribution : zulu
          java-version : '8'

      - name : Set up JDK 25
        uses : actions/setup-java@v4
        with :
          distribution : temurin
          java-version : '25'

      - name              : Build distribution zip on macOS
        working-directory : src
        run               : make dist SHELL=/bin/bash JDK_PATH_8="$JAVA_HOME_8_ARM64" JDK_PATH_25="$JAVA_HOME_25_ARM64"

      - name : Verify zip was produced
        run  : |
          set -euo pipefail
          ls -l dist_build/JxMake-${{ env.DIST_VER }}.zip

      - uses : actions/upload-artifact@v4
        with :
          name              : jxmake-dist-zip-macos
          path              : dist_build/JxMake-${{ env.DIST_VER }}.zip
          retention-days    : 1
          if-no-files-found : error
