# TRIGGER: manual only (Actions tab -> this workflow -> "Run workflow"), and
# restricted to the repo owner via the job-level `if:` check below - anyone
# else who dispatches it will see the job start and immediately no-op (GitHub
# has no way to hide workflow_dispatch itself from other collaborators, but
# this keeps them from actually burning Windows-runner minutes with it).

name: Test MDXplorer Windows runners

on:
  workflow_dispatch:

jobs:
  test:
    if: github.actor == 'blue-wind-25'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: util/MDXplorer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fail closed when Python is not on PATH
        run: |
          $env:PYTHON = 'this-python-does-not-exist'
          cmd /c mdx_server.cmd
          if ($LASTEXITCODE -eq 0) { throw "mdx_server.cmd should have failed when PYTHON is not found" }

      - name: Install dependencies and start server, verify it serves, stop it (mdx_server.cmd)
        run: |
          $ErrorActionPreference = 'Stop'

          # Prove requirements.txt gets installed automatically: uninstall
          # first so mdx_server.cmd has to do the install itself.
          python -m pip uninstall -y markdown-it-py mdit-py-plugins pygments mdurl 2>$null

          $job = Start-Job -ScriptBlock {
              Set-Location $using:PWD
              cmd /c "mdx_server.cmd -p 8080"
          }

          try {
              $ok = $false
              for ($i = 0; $i -lt 30; $i++) {
                  Start-Sleep -Seconds 1
                  try {
                      $resp = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/' -UseBasicParsing -TimeoutSec 2
                      if ($resp.StatusCode -eq 200) { $ok = $true; break }
                  } catch {}
              }
              if (-not $ok) {
                  Write-Host '---- job output ----'
                  Receive-Job $job | Write-Host
                  throw "mdx_server.cmd did not start serving on port 8080"
              }
              Write-Host "Server responded with status 200"
          } finally {
              Stop-Job $job -ErrorAction SilentlyContinue
              Receive-Job $job | Write-Host
              Remove-Job $job -Force -ErrorAction SilentlyContinue
              # Server has no shutdown endpoint; kill any leftover python.exe
              # bound to the test port so later steps/jobs start clean.
              Get-Process python -ErrorAction SilentlyContinue | Where-Object {
                  $_.Path -and (Get-NetTCPConnection -OwningProcess $_.Id -LocalPort 8080 -ErrorAction SilentlyContinue)
              } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Start server via mdx_server_rr.cmd, verify it serves repo root, stop it
        run: |
          $ErrorActionPreference = 'Stop'

          $job = Start-Job -ScriptBlock {
              Set-Location $using:PWD
              cmd /c "mdx_server_rr.cmd -p 8081"
          }

          try {
              $ok = $false
              for ($i = 0; $i -lt 30; $i++) {
                  Start-Sleep -Seconds 1
                  try {
                      $resp = Invoke-WebRequest -Uri 'http://127.0.0.1:8081/' -UseBasicParsing -TimeoutSec 2
                      if ($resp.StatusCode -eq 200) { $ok = $true; break }
                  } catch {}
              }
              if (-not $ok) {
                  Write-Host '---- job output ----'
                  Receive-Job $job | Write-Host
                  throw "mdx_server_rr.cmd did not start serving on port 8081"
              }
              if ($resp.Content -notmatch 'util') {
                  throw "mdx_server_rr.cmd does not appear to be serving the repo root (expected a 'util' entry)"
              }
              Write-Host "Server responded with status 200 and repo root listing"
          } finally {
              Stop-Job $job -ErrorAction SilentlyContinue
              Receive-Job $job | Write-Host
              Remove-Job $job -Force -ErrorAction SilentlyContinue
              Get-Process python -ErrorAction SilentlyContinue | Where-Object {
                  $_.Path -and (Get-NetTCPConnection -OwningProcess $_.Id -LocalPort 8081 -ErrorAction SilentlyContinue)
              } | Stop-Process -Force -ErrorAction SilentlyContinue
          }
