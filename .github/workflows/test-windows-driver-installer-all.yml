# Calls `test-windows-driver-installer-core.yml`

name: Test WindowsDriverInstaller (ALL PATHS)

on:
  workflow_dispatch:

jobs:
  # 1. Build the JAR exactly once on a fast, cheap Linux runner
  build-jar:
    name: Pre-build JxMake JAR
    if: github.actor == 'blue-wind-25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build JAR File
        working-directory: src
        run: |
          make jar JDK_VER=25 JDK_PATH_25="$JAVA_HOME"

      - name: Upload JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jxmake-jar
          path: src/jxmake.jar
          retention-days: 1 # Automatically cleanup quickly

  # 2. Run the PS1 test after the build completes
  run-ps1:
    name: Test PS1 Backend
    needs: build-jar
    if: github.actor == 'blue-wind-25'
    uses: ./.github/workflows/test-windows-driver-installer-core.yml
    with:
      backend: ps1
      run_mutating: true

  # 3. Run the FFM test after PS1 passes
  run-ffm:
    name: Test FFM Backend
    needs: [build-jar, run-ps1]
    if: github.actor == 'blue-wind-25'
    uses: ./.github/workflows/test-windows-driver-installer-core.yml
    with:
      backend: ffm
      run_mutating: true

  # 4. Run the Auto test after FFM passes
  run-auto:
    name: Test Auto Backend
    needs: [build-jar, run-ffm]
    if: github.actor == 'blue-wind-25'
    uses: ./.github/workflows/test-windows-driver-installer-core.yml
    with:
      backend: auto
      run_mutating: true
