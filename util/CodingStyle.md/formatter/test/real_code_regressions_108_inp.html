<!DOCTYPE html>
<html>
<body>
<p>HTML5 &lt;option&gt; implied-closing-trigger support.</p>
<select name=colors>
<option value=red>Red</option>
<option value=green>Green</option>
</select>
<datalist id=browsers>
<option value="Chrome">
<option value="Firefox">
<optgroup label=extras>
<option value="Safari">
</optgroup>
</datalist>
</body>
</html>
