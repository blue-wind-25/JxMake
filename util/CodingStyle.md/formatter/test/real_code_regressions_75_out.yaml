steps :
    - name : Checkout repository
      uses : actions/checkout@v4
    - name : Cache files
      uses : actions/cache@v3
      with :
            path         : |
                ~/.sonar
            key          : ${{ runner.os }}-sonar
            restore-keys : ${{ runner.os }}-sonar
